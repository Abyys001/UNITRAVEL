name: unitravel_mobile
description: "UniTravel mobile app: customer requests and admin triage (Flutter, ADR-0002)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  crypto: ^3.0.6
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^10.0.0
  go_router: ^18.0.2
  image_picker: ^1.2.3
  intl: ^0.20.3
  kit_ui:
    path: packages/kit_ui
  shamsi_date: ^1.1.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/mark.png
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/Montserrat-ExtraBold.ttf
          weight: 800
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Regular.ttf
        - asset: assets/fonts/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/vazirmatn/Vazirmatn-ExtraBold.ttf
          weight: 800

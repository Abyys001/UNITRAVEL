<!doctype html>
<!--
  Mobile-host landing (infra/mobile-shell). Phones and small screens go straight to the Flutter app at /app/;
  larger screens see the app running inside a device frame. Overrides: ?frame forces the frame, ?app skips it.
  qr.svg encodes https://mobile.unitravels.co.uk/app/; regenerate it if MOBILE_HOST changes.
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061f4c">
<meta name="description" content="UniTravel mobile app: compare routes, request a flight and track it with a real person behind it.">
<title>UniTravel App</title>
<link rel="icon" href="mark.svg" type="image/svg+xml">
<script>
  (function () {
    var q = new URLSearchParams(location.search)
    if (q.has('frame')) return
    var small = Math.min(screen.width, screen.height) < 768 && matchMedia('(pointer: coarse)').matches
    if (q.has('app') || small || innerWidth < 640) location.replace('app/' + location.hash)
  })()
</script>
<style>
  @font-face { font-family: Montserrat; src: url(fonts/Montserrat-Variable-latin.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: Vazirmatn; src: url(fonts/Vazirmatn-Variable.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }

  :root {
    --navy-950: #061f4c; --navy-900: #082f6b; --navy-800: #083575; --royal: #0c67b9; --cyan: #11b7ff;
    --orange: #ff8617; --orange-300: #ffac50; --cloud: #f4f8fd;
    --frame: #10151f; --frame-edge: #3a4354;
    --scale: 1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Montserrat, Vazirmatn, system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(1200px 700px at 78% 20%, rgba(12,103,185,.55), transparent 60%),
      radial-gradient(900px 600px at 10% 90%, rgba(255,134,23,.12), transparent 60%),
      linear-gradient(160deg, var(--navy-950) 0%, var(--navy-900) 55%, var(--navy-800) 100%);
    background-color: var(--navy-950);
    overflow: hidden;
  }
  html[dir="rtl"] body { font-family: Vazirmatn, Montserrat, system-ui, sans-serif; }
  .stars { position: fixed; inset: 0; pointer-events: none; opacity: .55;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 32% 72%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 56% 12%, #cfe9ff, transparent), radial-gradient(1px 1px at 72% 64%, #fff, transparent),
      radial-gradient(1px 1px at 88% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 22% 46%, #cfe9ff, transparent),
      radial-gradient(1px 1px at 44% 88%, #fff, transparent), radial-gradient(1px 1px at 94% 82%, #fff, transparent);
  }
  .route { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .route path { fill: none; stroke: rgba(255,172,80,.55); stroke-width: 2; stroke-dasharray: 6 10; animation: dash 30s linear infinite; }
  .route .plane { offset-path: path("M -40 640 C 320 380, 760 820, 1500 140"); animation: fly 18s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -480; } }
  @keyframes fly { from { offset-distance: 0%; } to { offset-distance: 100%; } }

  .stage { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
    gap: clamp(24px, 5vw, 96px); padding: 24px clamp(24px, 6vw, 112px); max-width: 1440px; margin: 0 auto; }

  /* Copy column */
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
  .brand img { width: 52px; height: 52px; }
  .brand b { display: block; font-weight: 800; letter-spacing: .14em; font-size: 18px; }
  .brand span { display: block; font-family: Vazirmatn, sans-serif; font-size: 14px; color: #bcd3f0; }
  h1 { font-weight: 800; font-size: clamp(34px, 4.2vw, 60px); line-height: 1.05; margin: 0 0 18px; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--orange-300); }
  html[dir="rtl"] h1 { line-height: 1.35; letter-spacing: 0; }
  .lede { font-size: 18px; line-height: 1.6; color: #d4e3f7; max-width: 34em; margin: 0 0 32px; }
  .features { list-style: none; padding: 0; margin: 0 0 36px; display: grid; gap: 14px; max-width: 34em; }
  .features li { display: flex; gap: 14px; align-items: flex-start; font-size: 15px; line-height: 1.5; color: #e6effa; }
  .features svg { flex: none; width: 34px; height: 34px; padding: 7px; border-radius: 999px; border: 1.5px solid rgba(17,183,255,.6); color: var(--cyan); }
  .features strong { display: block; color: #fff; font-weight: 700; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 16px; font: inherit;
    font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; border: 0; transition: transform .15s ease, background .15s ease; }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible, .swatch:focus-visible, .lang:focus-visible, .tool:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  .btn-orange { background: var(--orange); color: var(--navy-950); }
  .btn-glass { background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); backdrop-filter: blur(8px); }
  .qr { display: flex; align-items: center; gap: 16px; margin-top: 36px; padding: 14px; border-radius: 20px; width: fit-content;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .qr .code { width: 92px; height: 92px; padding: 8px; border-radius: 12px; background: #fff; }
  .qr .code svg { display: block; width: 100%; height: 100%; }
  .qr p { margin: 0; font-size: 14px; line-height: 1.5; color: #d4e3f7; max-width: 15em; }
  .qr p b { color: #fff; display: block; }
  .qr bdi { font-weight: 600; color: var(--orange-300); }
  .lang { margin-inline-start: 18px; font: inherit; font-weight: 700; font-size: 13px; color: #fff; background: rgba(255,255,255,.1); border: 0; border-radius: 999px;
    padding: 8px 14px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
  .note { margin-top: 22px; font-size: 12px; color: #9fb6d6; }

  /* Device */
  .device-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .scaler { width: calc(422px * var(--scale)); height: calc(876px * var(--scale)); }
  .phone { width: 422px; height: 876px; transform: scale(var(--scale)); transform-origin: top left; position: relative;
    border-radius: 68px; padding: 16px; background: var(--frame);
    box-shadow: 0 0 0 2px var(--frame-edge), 0 0 0 5px #05080d, 0 50px 100px -20px rgba(0,0,0,.65), 0 30px 60px -30px rgba(17,183,255,.35),
      inset 0 0 6px rgba(255,255,255,.15);
    transition: background .3s ease, box-shadow .3s ease; }
  .btn-side { position: absolute; width: 4px; border-radius: 2px; background: var(--frame-edge); }
  .btn-side.a { left: -6px; top: 170px; height: 34px; } .btn-side.b { left: -6px; top: 228px; height: 64px; }
  .btn-side.c { left: -6px; top: 306px; height: 64px; } .btn-side.d { right: -6px; top: 250px; height: 100px; }
  .screen { position: relative; width: 390px; height: 844px; border-radius: 54px; overflow: hidden; background: var(--navy-950);
    display: flex; flex-direction: column; isolation: isolate; }
  .status { flex: none; height: 54px; padding: 0 30px 0 40px; display: flex; align-items: center; justify-content: space-between;
    font-weight: 700; font-size: 16px; color: #fff; background: var(--navy-950); font-variant-numeric: tabular-nums; direction: ltr; }
  .status .icons { display: flex; gap: 6px; align-items: center; }
  .island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 3; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; }
  .home { flex: none; height: 26px; background: #fff; display: grid; place-items: center; }
  .home i { width: 136px; height: 5px; border-radius: 3px; background: #0b1220; }
  .loader { position: absolute; inset: 54px 0 26px; display: grid; place-items: center; background: var(--navy-950); transition: opacity .4s ease; z-index: 2; }
  .loader img { width: 84px; height: 84px; animation: pulse 1.6s ease-in-out infinite; }
  .loader.done { opacity: 0; pointer-events: none; }
  @keyframes pulse { 50% { transform: scale(.92); opacity: .7; } }

  .tools { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 999px; background: rgba(255,255,255,.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .swatch { width: 26px; height: 26px; border-radius: 999px; border: 2px solid rgba(255,255,255,.35); cursor: pointer; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: var(--orange); box-shadow: 0 0 0 2px var(--navy-950), 0 0 0 4px var(--orange); }
  .tool { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; color: #fff; cursor: pointer; }
  .tool:hover { background: rgba(255,255,255,.12); }
  .sep { width: 1px; height: 20px; background: rgba(255,255,255,.2); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 1080px) {
    .stage { grid-template-columns: 1fr; justify-items: center; overflow-y: auto; }
    .copy { display: none; }
    body { overflow: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .route path, .route .plane, .loader img { animation: none; }
    .route .plane { offset-distance: 62%; }
  }
</style>
</head>

<script>
  var T = {
    en: {
      title: 'Your whole journey, <em>in your pocket.</em>',
      lede: 'Compare routes between the UK, Europe, Türkiye, Armenia and Iran, send a request in a minute, and follow it with a real person on the other side.',
      f1t: 'Smart route search', f1: 'Connections, self-transfers and gateway starts, with honest badges on every result.',
      f2t: 'A human behind every request', f2: 'Our team confirms seats, baggage and price before anything is booked.',
      f3t: 'Cargo and documents', f3: 'Ask for a quote on documents and parcels on the lanes we serve.',
      open: 'Open the app', site: 'Visit the website',
      scan: 'On your phone?', scan2: 'Scan the code or go to', note: 'Demo environment: test data only. Requesting does not book a seat.',
      lang: 'فارسی', langCode: 'fa'
    },
    fa: {
      title: 'تمام سفرتان، <em>در جیب شما.</em>',
      lede: 'مسیرهای بین بریتانیا، اروپا، ترکیه، ارمنستان و ایران را مقایسه کنید، در یک دقیقه درخواست بفرستید و آن را با یک همکار واقعی دنبال کنید.',
      f1t: 'جستجوی هوشمند مسیر', f1: 'پروازهای متصل، ترانزیت مستقل و شروع از کشورهای واسط، با برچسب‌های شفاف روی هر نتیجه.',
      f2t: 'یک انسان پشت هر درخواست', f2: 'تیم ما پیش از هر رزروی صندلی، بار و قیمت را تأیید می‌کند.',
      f3t: 'بار و مدارک', f3: 'برای ارسال مدارک و بسته در مسیرهای فعال ما استعلام قیمت بگیرید.',
      open: 'باز کردن اپلیکیشن', site: 'رفتن به وب‌سایت',
      scan: 'با گوشی هستید؟', scan2: 'کد را اسکن کنید یا بروید به', note: 'محیط نمایشی: فقط داده‌های آزمایشی. ثبت درخواست به معنی رزرو صندلی نیست.',
      lang: 'English', langCode: 'en'
    }
  }
  var lang = 'en'
  try { lang = localStorage.getItem('ut-shell-lang') || (navigator.language || '').slice(0, 2) === 'fa' && 'fa' || 'en' } catch (e) {}
  function apply() {
    var t = T[lang]
    document.documentElement.lang = lang
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr'
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t[el.dataset.i18n] })
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) { el.innerHTML = t[el.dataset.i18nHtml] })
    var b = document.getElementById('lang'); b.textContent = t.lang; b.lang = t.langCode
  }
  document.getElementById('lang').addEventListener('click', function () {
    lang = lang === 'en' ? 'fa' : 'en'
    try { localStorage.setItem('ut-shell-lang', lang) } catch (e) {}
    apply()
  })
  apply()

  document.getElementById('host').textContent = location.host
  document.getElementById('site').href = location.protocol + '//' + location.host.replace(/^mobile\./, 'demo.') + '/'

  function fit() {
    var avail = innerHeight - 110
    document.documentElement.style.setProperty('--scale', Math.max(.5, Math.min(1, avail / 876)).toFixed(3))
  }
  addEventListener('resize', fit); fit()

  function tick() {
    var d = new Date()
    document.getElementById('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0')
  }
  tick(); setInterval(tick, 15000)

  var frame = document.getElementById('app'), loader = document.getElementById('loader')
  frame.addEventListener('load', function () { setTimeout(function () { loader.classList.add('done') }, 900) })
  document.getElementById('reload').addEventListener('click', function () {
    loader.classList.remove('done'); frame.src = 'app/' + '?r=' + Date.now()
  })

  var phone = document.getElementById('phone')
  document.querySelectorAll('.swatch').forEach(function (s) {
    s.addEventListener('click', function () {
      document.querySelectorAll('.swatch').forEach(function (o) { o.setAttribute('aria-pressed', String(o === s)) })
      phone.style.setProperty('--frame', s.dataset.frame); phone.style.setProperty('--frame-edge', s.dataset.edge)
      try { localStorage.setItem('ut-shell-frame', s.dataset.frame) } catch (e) {}
    })
  })
  try { var saved = localStorage.getItem('ut-shell-frame'); saved && document.querySelector('.swatch[data-frame="' + saved + '"]').click() } catch (e) {}
</script>
</body>
</html>
